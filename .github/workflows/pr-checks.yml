name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:55432/unused
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:55432/unused
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mythos_test
          POSTGRES_PASSWORD: mythos_local_test_2026
          POSTGRES_DB: mythos_integration_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U mythos_test -d mythos_integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mythos_test:mythos_local_test_2026@127.0.0.1:55432/mythos_integration_test?schema=public
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm test -- --runInBand --testPathPatterns='integration-chapter-.*db.test|proposal-integrity.db.test'
        env:
          MYTHOS_RUN_DB_INTEGRATION: '1'
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://mythos_test:mythos_local_test_2026@127.0.0.1:55432/mythos_integration_test?schema=universe_acceptance
      - run: npm test -- --runInBand --testPathPatterns='universe-service.db.test'
        env:
          DATABASE_URL: postgresql://mythos_test:mythos_local_test_2026@127.0.0.1:55432/mythos_integration_test?schema=universe_acceptance
          MYTHOS_RUN_UNIVERSE_TEST: '1'

  container-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image without publishing
        run: docker build --pull --tag mythos-security-review:ci .
      - name: Check runtime and local migration CLI without a database
        run: |
          docker run --rm --network none --entrypoint sh --env CHECKPOINT_DISABLE=1 mythos-security-review:ci -c '
            set -eu
            node --version
            node /app/node_modules/prisma/build/index.js --version
            test ! -e /app/.env
            test ! -e /app/node_modules/jest
            test ! -e /app/node_modules/eslint
            test ! -e /usr/local/bin/npm
            for helper in /usr/bin/mount /usr/bin/umount; do
              test ! -u "$helper"
              test ! -g "$helper"
            done
          '
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install regression test dependencies
        run: |
          cd frontend
          npm ci
          npx --no-install prisma generate
      - name: Test hardened container migration, uploads, auth and MCP
        run: scripts/security/test-container.sh mythos-security-review:ci
      - name: Test scan comparison policy
        run: node --test scripts/security/*.test.mjs
      - name: Export runtime image
        run: docker save --output "${RUNNER_TEMP}/mythos-image.tar" mythos-security-review:ci
      - name: Scan all findings and reject critical vulnerabilities
        run: |
          docker run --rm \
            --volume "${RUNNER_TEMP}/mythos-image.tar:/scan/mythos.tar:ro" \
            anchore/grype:v0.121.0 docker-archive:/scan/mythos.tar \
            --output json --fail-on critical > "${RUNNER_TEMP}/container-scan.json"
      - name: Reject high vulnerabilities with available fixes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const scan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/container-scan.json', 'utf8'));
          const high = scan.matches.filter(m => m.vulnerability.severity === 'High');
          const fixable = high.filter(m => m.vulnerability.fix?.versions?.length);
          console.log(`High findings: ${high.length}; with available fixes: ${fixable.length}`);
          for (const m of fixable) console.error(m.vulnerability.id, m.artifact.name, m.artifact.version);
          process.exitCode = fixable.length ? 1 : 0;
          NODE
      - name: Retain complete vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-vulnerability-report
          path: ${{ runner.temp }}/container-scan.json
