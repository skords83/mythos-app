services:
  db:
    image: postgres:15-alpine
    container_name: mythos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mythos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mythos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mythos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
  redis:
    image: redis:7-alpine
    container_name: mythos-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
  app:
    image: ghcr.io/skords83/mythos-app/app:latest
    container_name: mythos-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mythos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mythos}
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/public/uploads
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - uploads_data:/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mythos.rule=Host(`mythos.skords.de`)"
      - "traefik.http.routers.mythos.entrypoints=websecure"
      - "traefik.http.routers.mythos.tls.certresolver=letsencrypt"
      - "traefik.http.services.mythos.loadbalancer.server.port=4000"
    networks:
      - proxy
      - internal
volumes:
  postgres_data:
  uploads_data:
  redis_data:
networks:
  proxy:
    external: true
  internal: